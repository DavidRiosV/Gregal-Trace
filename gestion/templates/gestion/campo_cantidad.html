{% comment %}
Cantidad de material. La unidad (m, ud, kg...) se escribe al lado al elegir el material (main.js).
{% endcomment %}
<div class="campo campo--cantidad">
    <label for="{{ formulario.cantidad.id_for_label }}">{{ formulario.cantidad.label }}</label>
    <div class="entrada entrada--unidad{% if formulario.cantidad.errors %} entrada--error{% endif %}">
        {{ formulario.cantidad }}
        <span class="entrada__unidad" data-unidad-cantidad></span>
    </div>
    {% for error in formulario.cantidad.errors %}<p class="error-campo">{{ error }}</p>{% endfor %}
</div>
